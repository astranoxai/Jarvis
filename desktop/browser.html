<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NOVA Browser</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      overflow: hidden;

      background:
        #020809;

      color:
        #efffff;

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;
    }


    .toolbar {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      height: 58px;

      display: flex;
      align-items: center;

      gap: 7px;

      padding:
        8px 10px;

      border-bottom:
        1px solid
        rgba(116,239,231,.13);

      background:
        rgba(3,15,17,.98);

      z-index: 20;
    }


    .brand {

      min-width: 75px;

      margin-right: 5px;

      color:
        #a3fff7;

      font-size: 13px;
      font-weight: 800;

      letter-spacing: 3px;

      text-align: center;
    }


    button {

      min-width: 38px;
      height: 38px;

      border:
        1px solid
        rgba(111,238,231,.18);

      border-radius: 9px;

      background:
        rgba(255,255,255,.025);

      color:
        #dffffc;

      cursor: pointer;

      font-size: 13px;

      transition:
        .15s ease;
    }


    button:hover {

      border-color:
        rgba(126,255,246,.5);

      background:
        rgba(76,221,213,.09);
    }


    .address {

      flex: 1;

      height: 38px;

      padding:
        0 13px;

      border:
        1px solid
        rgba(111,238,231,.15);

      border-radius: 10px;

      outline: none;

      background:
        #071618;

      color:
        white;

      font-size: 12px;
    }


    .address:focus {

      border-color:
        rgba(135,255,247,.55);

      box-shadow:
        0 0 16px
        rgba(66,220,211,.08);
    }


    .quick {

      min-width: auto;

      padding:
        0 10px;

      color:
        #8ef9f1;

      font-size: 8px;
      font-weight: 800;

      letter-spacing: .7px;
    }


    .status {

      position: fixed;

      right: 10px;
      bottom: 7px;

      z-index: 30;

      padding:
        5px 9px;

      border-radius: 20px;

      background:
        rgba(1,12,14,.82);

      color:
        #74ded8;

      font-size: 7px;

      pointer-events: none;
    }

  </style>

</head>


<body>


  <div class="toolbar">


    <div class="brand">

      NOVA

    </div>


    <button
      id="backButton"
      title="Back"
    >
      ←
    </button>


    <button
      id="forwardButton"
      title="Forward"
    >
      →
    </button>


    <button
      id="reloadButton"
      title="Reload"
    >
      ↻
    </button>


    <button
      id="homeButton"
      title="Home"
    >
      ⌂
    </button>


    <input
      id="addressBar"
      class="address"
      type="text"
      autocomplete="off"
      spellcheck="false"
      placeholder="Search Google or enter a website..."
    >


    <button
      id="goButton"
      class="quick"
    >
      GO
    </button>


    <button
      id="googleButton"
      class="quick"
    >
      GOOGLE
    </button>


    <button
      id="gmailButton"
      class="quick"
    >
      GMAIL
    </button>


    <button
      id="youtubeButton"
      class="quick"
    >
      YOUTUBE
    </button>


    <button
      id="githubButton"
      class="quick"
    >
      GITHUB
    </button>


  </div>


  <div
    id="status"
    class="status"
  >
    NOVA BROWSER
  </div>


  <script>

    const $ =
      id =>
        document.getElementById(
          id
        );


    const addressBar =
      $('addressBar');


    const status =
      $('status');


    function navigate() {

      const value =
        addressBar.value.trim();


      if (
        !value
      ) {

        return;
      }


      window.novaAPI
        ?.browserNavigate?.(
          value
        );
    }


    $('goButton')
      .addEventListener(
        'click',
        navigate
      );


    addressBar
      .addEventListener(
        'keydown',
        event => {

          if (
            event.key ===
            'Enter'
          ) {

            navigate();
          }
        }
      );


    $('backButton')
      .addEventListener(
        'click',
        () => {

          window.novaAPI
            ?.browserBack?.();
        }
      );


    $('forwardButton')
      .addEventListener(
        'click',
        () => {

          window.novaAPI
            ?.browserForward?.();
        }
      );


    $('reloadButton')
      .addEventListener(
        'click',
        () => {

          window.novaAPI
            ?.browserReload?.();
        }
      );


    $('homeButton')
      .addEventListener(
        'click',
        () => {

          window.novaAPI
            ?.browserHome?.();
        }
      );


    $('googleButton')
      .addEventListener(
        'click',
        () => {

          window.novaAPI
            ?.browserNavigate?.(
              'https://www.google.com/'
            );
        }
      );


    $('gmailButton')
      .addEventListener(
        'click',
        () => {

          window.novaAPI
            ?.browserNavigate?.(
              'https://mail.google.com/'
            );
        }
      );


    $('youtubeButton')
      .addEventListener(
        'click',
        () => {

          window.novaAPI
            ?.browserNavigate?.(
              'https://www.youtube.com/'
            );
        }
      );


    $('githubButton')
      .addEventListener(
        'click',
        () => {

          window.novaAPI
            ?.browserNavigate?.(
              'https://github.com/'
            );
        }
      );


    window.novaAPI
      ?.onBrowserState?.(
        state => {

          if (
            state?.url &&
            document.activeElement !==
              addressBar
          ) {

            addressBar.value =
              state.url;
          }


          $('backButton').disabled =
            !state?.canGoBack;


          $('forwardButton').disabled =
            !state?.canGoForward;


          status.textContent =
            state?.loading

              ? 'LOADING...'

              : 'NOVA BROWSER';
        }
      );

  </script>


</body>

</html>
